var DATA={conversations:[
{id:"awa",person:"awa",msgs:[
{from:"awa",time:"2026-09-08T21:03",text:"Ton cours était incroyable ce soir 🙏"},
{from:"theo",time:"2026-09-08T21:10",text:"Merci Awa ! Tu progresses très vite, c'est agréable d'avoir des élèves aussi motivées."},
{from:"awa",time:"2026-09-08T21:11",text:"Des élèves… ou juste moi ? 😉"},
{from:"theo",time:"2026-09-08T21:24",text:"Haha. Va te coucher, prochaine séance mardi 19 h 😄"},
{from:"awa",time:"2026-09-08T21:25",text:"Toujours sérieux, toi. Bonne nuit Théo."},
{from:"awa",time:"2026-09-10T23:48",text:"Je repense à notre discussion après le cours."},
{from:"awa",time:"2026-09-10T23:49",text:"Tu sais que tu me plais, hein ?"},
{from:"theo",time:"2026-09-10T23:59",text:"Awa… je suis flatté. Vraiment. Mais je préfère qu'on en reste là."},
{from:"theo",time:"2026-09-11T09:12",text:"Je préfère être honnête : je ne veux pas mélanger ma vie perso et mes cours. Ça mettrait tout le monde mal à l'aise, surtout le groupe."},
{from:"awa",time:"2026-09-11T09:30",text:"Donc c'est non."},
{from:"theo",time:"2026-09-11T09:31",text:"Je veux rester ton prof. C'est déjà beaucoup, et c'est bien."},
{from:"awa",time:"2026-09-11T12:02",text:"T'as pas le droit de me sortir ça par message."},
{from:"awa",time:"2026-09-13T19:55",text:"Les autres filles parlent de toi, tu sais. Tu crois que j'ai pas vu comment tu regardes Léa ?"},
{from:"theo",time:"2026-09-13T20:14",text:"Ce n'est pas le sujet. On en parle calmement à la prochaine séance, si tu veux."},
{from:"awa",time:"2026-09-13T20:15",text:"Ne me demande pas de me « calmer »."},
{from:"awa",time:"2026-09-14T22:41",text:"On doit parler."},
{from:"theo",time:"2026-09-14T22:44",text:"Pas ce soir."},
{from:"awa",time:"2026-09-14T22:46",text:"Très bien."},
{from:"awa",time:"2026-09-14T23:12",text:"Tu vas regretter ce que tu as fait.",ev:ev("ev_menace","mobile","awa","2026-09-14T23:12","14 sept · 23:12","Menace d'Awa","« Tu vas regretter ce que tu as fait. » — envoyée la veille du meurtre.")},

function renderConvos(){var html="";DATA.conversations.forEach(function(c){var name=c.name||PEOPLE[c.person].name;var last=c.msgs[c.msgs.length-1];var unread=state.readConvos.indexOf(c.id)<0;var av=(c.person==="groupe")?'<div class="avatar" style="background:#3b6ea8">🧘</div>':personAvatar(c.person);html+='<button class="convo '+(unread?"unread":"")+'" data-action="open-convo" data-id="'+c.id+'">'+av+'<div><div class="nm">'+esc(name)+'</div><div class="pv">'+esc(last.text)+'</div></div><div class="tm">'+fmtDay(last.time)+'</div></button>';});$("#appbody").innerHTML=html;}
function openConvo(id){var c=DATA.conversations.find(function(x){return x.id===id;});if(state.readConvos.indexOf(id)<0)state.readConvos.push(id);c.msgs.forEach(function(m,i){state.readMsgs[id+"_"+i]=true;});save();checkProgress();var name=c.name||PEOPLE[c.person].name;var html='<div class="apphead" style="position:sticky;top:-12px;z-index:5;margin:-12px -14px 10px;padding-left:14px"><button class="backbtn" data-action="back-convos">‹ Conversations</button><div class="title">'+esc(name)+'</div></div>';var lastDay="";c.msgs.forEach(function(m){var day=fmtDay(m.time);if(day!==lastDay){html+='<div class="daysep">'+day+'</div>';lastDay=day;}var side=(m.from==="theo")?"me":"them";var whoTag="";if(c.person==="groupe"&&side==="them"){var pn=(PEOPLE[m.from]||{name:m.from}).name;whoTag='<span class="who">'+esc(pn)+'</span>';}html+='<div class="msg '+side+'"><div class="b">'+whoTag+esc(m.text)+'<span class="snd">'+fmtTime(m.time)+'</span></div></div>';if(m.ev){var al=(side==="me")?" right":"";html+='<div class="evwrap'+al+'"><button class="evmark" data-action="add-ev" data-id="'+m.ev.id+'">🔍 Marquer comme indice</button></div>';}});$("#appbody").innerHTML=html;refreshEvButtons();}
function renderCalls(){var icons={in:"📲",out:"📤",miss:"📵"};var html="";DATA.calls.forEach(function(c){var evb=c.ev?'<button class="evmark" data-action="add-ev" data-id="'+c.ev.id+'" style="margin:0 0 0 8px">🔍</button>':"";var dirTxt=c.dir==="miss"?"appel manqué":(c.dir==="in"?"entrant":"sortant");html+='<div class="callrow"><div class="callico '+(c.dir==="miss"?"missed":"")+'">'+icons[c.dir]+'</div><div><div class="cn '+(c.dir==="miss"?"missed":"")+'">'+esc(c.name)+'</div><div class="cd">'+fmtDay(c.time)+' · '+dirTxt+'</div></div><div class="ct">'+fmtTime(c.time)+'<br>'+esc(c.dur)+'</div>'+evb+'</div>';});$("#appbody").innerHTML=html;refreshEvButtons();}
function photoImgHTML(id,cap,extra){if(id==="p3")return "";return imgTag(id,cap,extra);}
function renderPhotos(){var html='<div class="pgrid">';DATA.photos.forEach(function(p){html+='<button class="pthumb" data-action="open-photo" data-id="'+p.id+'" aria-label="'+esc(p.cap)+'">'+PHOTO_ART[p.id]+photoImgHTML(p.id,p.cap,'loading="lazy" decoding="async"')+'<span class="tag">'+esc(p.meta.split("·")[0].trim())+'</span></button>';});html+='</div><p style="font-size:12px;color:var(--mut);margin-top:12px">Touchez une photo pour l\'examiner. Certaines cachent des détails : cherchez les cercles dorés.</p>';$("#appbody").innerHTML=html;}
function openPhoto(id){var old=$("#viewer");if(old)old.remove();var p=DATA.photos.find(function(x){return x.id===id;});var hotspots="";(p.hotspots||[]).forEach(function(h,i){var found=hasFound(h.ev.id);hotspots+='<button class="hotspot'+(found?" found":"")+'" style="left:'+h.x+'%;top:'+h.y+'%" data-action="find-hotspot" data-id="'+p.id+'" data-idx="'+i+'">'+(found?"✓":"?")+'</button>';});var evbtn=(p.ev&&!p.hotspots)?'<button class="evmark" data-action="add-ev" data-id="'+p.ev.id+'">🔍 Marquer comme indice</button>':"";var detail=p.detail?'<div class="findnote" style="margin-top:10px;white-space:pre-line">'+esc(p.detail)+'</div>':"";$("#appview").insertAdjacentHTML("beforeend",'<div class="viewer" id="viewer"><button class="vclose" data-action="close-viewer">✕ Fermer</button><div class="big">'+PHOTO_ART[p.id]+photoImgHTML(id,p.cap,'decoding="async"')+hotspots+'</div><div class="cap"><b>'+esc(p.cap)+'</b></div><div class="meta">'+esc(p.meta)+'</div>'+detail+evbtn+'<div id="findmsg"></div></div>');refreshEvButtons();}
function findHotspot(pid,idx){var p=DATA.photos.find(function(x){return x.id===pid;});var h=p.hotspots[idx];if(!hasFound(h.ev.id)){state.foundHot.push(h.ev.id);save();var btns=document.querySelectorAll("#viewer .hotspot");if(btns[idx]){btns[idx].classList.add("found");btns[idx].textContent="✓";}addEv(h.ev.id);}$("#findmsg").innerHTML='<div class="findnote">🔎 '+esc(h.found)+'</div>';}
function renderNotes(){var html="";DATA.notes.forEach(function(n){if(n.locked&&!state.noteUnlocked){html+='<div class="notecard locked"><h4>🔒 '+esc(n.title)+'</h4><p style="color:var(--mut)">Note verrouillée — un code à 4 chiffres est requis.</p><p class="nd">'+esc(n.hint)+'</p><button class="btn" data-action="lock-form">Saisir le code</button><div id="lockform"></div></div>';return;}var evb=n.ev?'<button class="evmark" data-action="add-ev" data-id="'+n.ev.id+'">🔍 Marquer comme indice</button>':"";html+='<div class="notecard '+(n.ev?"evhint":"")+'"><h4>'+(n.locked?"🔓 ":"")+esc(n.title)+'</h4><p>'+esc(n.body)+'</p><div class="nd">'+esc(n.date)+' 2026</div>'+evb+'</div>';});$("#appbody").innerHTML=html;refreshEvButtons();}
function renderLockForm(){var f=$("#lockform");if(!f)return;f.innerHTML='<div class="codebox"><input id="codeinp" maxlength="4" inputmode="numeric" placeholder="····"><button class="btn" data-action="try-code">Déverrouiller</button></div><p style="font-size:11px;color:var(--mut);margin-top:8px">Astuce : l\'indice est dans une autre note du téléphone.</p>';var inp=$("#codeinp");if(inp)inp.focus();}
function tryCode(){var inp=$("#codeinp");if(!inp)return;var v=inp.value.trim();var n=DATA.notes.find(function(x){return x.locked;});if(v===n.code){state.noteUnlocked=true;save();toast("🔓 Note privée déverrouillée.",true);renderNotes();checkProgress();}else{toast("Code incorrect. Réfléchissez : quelle date comptait pour Théo ?");}}
function renderCalendar(){var html='<p style="font-size:12px;color:var(--mut);margin-bottom:10px">Septembre 2026 — semaine du 14 au 20</p>';DATA.calendar.forEach(function(d){html+='<div class="calrow"><div class="d">'+esc(d.day)+'</div>';if(d.events.length===0){html+='<div style="font-size:12px;color:#55617a;font-style:italic;padding:4px 9px">Aucun événement</div>';}d.events.forEach(function(e2){var cls="evline";if(e2.deleted)cls+=" deleted";var st=e2.cancelled?' style="opacity:.5;text-decoration:line-through"':"";var evb=e2.ev?'<button class="evmark" data-action="add-ev" data-id="'+e2.ev.id+'" style="margin:0 0 0 auto">🔍</button>':"";html+='<div class="'+cls+'"'+st+'><span class="h">'+e2.h+'</span><span>'+esc(e2.t)+'</span>'+evb+'</div>';});html+='</div>';});$("#appbody").innerHTML=html;refreshEvButtons();}
function renderContacts(){var html="";DATA.contacts.forEach(function(c){var p=PEOPLE[c.p];html+='<div class="crow">'+personAvatar(c.p)+'<div><div style="font-size:14px;font-weight:600">'+esc(p.name)+'</div><div class="role">'+esc(p.fact)+' · '+c.tel+'</div></div></div>';});$("#appbody").innerHTML=html;}
function showTab(t){document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-tab")===t);});document.querySelectorAll(".bpanel").forEach(function(p){p.classList.remove("on");});$("#bp-"+t).classList.add("on");}
function chipsHTML(){var h='<div class="chips">';HYPOTHESES.forEach(function(txt,i){var on=state.hyps.indexOf(i)>=0;h+='<button class="chip'+(on?"":" off")+'" data-action="toggle-hyp" data-id="'+i+'">'+(on?"✓ ":"")+esc(txt)+'</button>';});return h+'</div>';}
function renderBoard(){var bi=$("#bp-indices");var html=chipsHTML();if(state.evidence.length===0){html+='<div class="empty">Aucun indice pour le moment.<br>Explorez le téléphone et touchez les boutons 🔍.</div>';}else{state.evidence.forEach(function(id){var e2=EV_INDEX[id];if(!e2)return;html+='<div class="evcard cat-'+e2.cat+'"><div class="lbl">'+esc(e2.label)+'</div><div class="dsc">'+esc(e2.desc)+'</div><div class="cats">'+CATNAMES[e2.cat]+' · '+esc(e2.time)+'</div></div>';});}bi.innerHTML=html;
var doss={awa:{st:"haut",lines:{ev_menace:"Menace directe la veille du meurtre.",ev_awa_presente:"A confirmé sa présence à la dernière séance.",ev_appel_manque:"A appelé Théo à 23 h 05, juste après sa menace."}},sarah:{st:"bas",lines:{ev_sarah_creneau:"Elle connaissait un créneau… supprimé du planning.",ev_reflet:"Présente dans le studio à 18 h 52.",ev_appel_inconnu:"Et si le numéro inconnu était le sien ?"}},theo:{st:"bas",lines:{ev_rdv_avant:"Avait « un truc à régler » avant la séance.",ev_commissariat:"Était convoqué au commissariat le jour de sa mort, à 14 h 30.",ev_creneau_supprime:"Un rendez-vous de 18 h 30 a été effacé de son agenda.",ev_note_s:"Voulait parler à « S. » de vendredi.",ev_note_privee:"Redoutait le rendez-vous de mardi."}}};
var bs=$("#bp-suspects");html="";Object.keys(doss).forEach(function(who){var d=doss[who];var p=PEOPLE[who];var lines="";Object.keys(d.lines).forEach(function(eid){if(hasEv(eid))lines+="<li>"+esc(d.lines[eid])+"</li>";});var stlbl=d.st==="haut"?"SUSPICION ÉLEVÉE":(d.st==="moyen"?"SUSPICION MOYENNE":"À ÉCLAIRCIR");html+='<div class="suspect"><h4>'+personAvatar(who)+' '+esc(p.name)+'<span class="st '+d.st+'">'+stlbl+'</span></h4><div class="profil">'+esc(p.fact)+'</div>'+(lines?"<ul>"+lines+"</ul>":'<div style="font-size:12px;color:var(--mut);margin-top:6px">Aucun élément à charge pour le moment.</div>')+'</div>';});html+='<div class="empty" style="font-size:12px">Autres personnes du groupe : Camille, Léa, Manon, Julie, Nina, Clara, Alice.<br>Leurs dossiers seront ouverts au chapitre 3.</div>';bs.innerHTML=html;
var bt=$("#bp-chrono");var items=state.evidence.map(function(id){return EV_INDEX[id];}).filter(function(e2){return e2&&e2.ts;}).sort(function(a,b){return a.ts.localeCompare(b.ts);});if(items.length===0){bt.innerHTML='<div class="empty">La chronologie se construira à partir des indices datés<br>(messages, appels, photos, agenda…).</div>';}else{html="";items.forEach(function(e2){html+='<div class="tlitem"><span class="t">'+esc(e2.time)+'</span><span>'+esc(e2.label)+'</span><span class="c">'+CATNAMES[e2.cat]+'</span></div>';});bt.innerHTML=html;}}
function toggleHyp(i){var x=state.hyps.indexOf(i);if(x>=0)state.hyps.splice(x,1);else state.hyps.push(i);save();renderBoard();}
function openModal(html){$("#modalroot").innerHTML='<div class="modal" id="modalbg"><div class="mbox">'+html+'</div></div>';}
function closeModal(){$("#modalroot").innerHTML="";}
function openHelp(){openModal("<h3>💡 Aide à l'enquête</h3><p style='font-size:13px'>Choisissez un niveau d'indice. L'aide ne donne jamais la réponse directement.</p><div class='btns' style='flex-direction:column;align-items:stretch'><button class='btn' data-action='give-hint' data-level='1'>Niveau 1 — orientation générale</button><button class='btn' data-action='give-hint' data-level='2'>Niveau 2 — piste</button><button class='btn' data-action='give-hint' data-level='3'>Niveau 3 — indice précis</button></div><div id='hintout'></div><div class='btns'><button class='btn' data-action='close-modal'>Fermer</button></div>");}
function giveHint(n){var txt="";if(n===1)txt="Ne vous arrêtez pas aux apparences. Lisez TOUTES les conversations, même les plus anodines, et regardez les notes et l'agenda de Théo. Chaque personne se révèle par ce qu'elle écrit.";else if(n===2)txt="Comparez ce que disent les messages avec le calendrier. Un créneau a disparu de l'agenda du 15 septembre. Qui, dans les messages, semble pourtant au courant ?";else txt="Ouvrez la photo « Selfie miroir » en grand : un cercle doré indique une zone à examiner, sur le bord droit du miroir. Et une note privée est verrouillée — l'indice du code se trouve dans la note « Anniversaire du groupe » (12 mars → 1203).";state.hintsUsed=Math.max(state.hintsUsed,n);save();var o=$("#hintout");if(o)o.innerHTML='<div class="hintout">'+esc(txt)+'</div>';}
function openBoard(){$("#board").classList.add("open");$("#boardclose").style.display="inline-block";}
function closeBoard(){$("#board").classList.remove("open");$("#boardclose").style.display="none";}
function resetDemo(){if(confirm("Réinitialiser toute la progression de la démo ?")){try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();}}
document.addEventListener("click",function(e){var el=e.target.closest("[data-action]");if(!el)return;var act=el.getAttribute("data-action");var id=el.getAttribute("data-id")||"";if(act==="slide-next")nextSlide();else if(act==="go-home")goHome();else if(act==="open-app")openAppClick(id);else if(act==="teaser")toast("🔒 Disponible au chapitre suivant.");else if(act==="open-convo")openConvo(id);else if(act==="back-convos"){openApp("messages");}else if(act==="add-ev")addEv(id);else if(act==="open-photo")openPhoto(id);else if(act==="close-viewer"){var v=$("#viewer");if(v)v.remove();}else if(act==="find-hotspot")findHotspot(id,parseInt(el.getAttribute("data-idx")||"0",10));else if(act==="lock-form")renderLockForm();else if(act==="try-code")tryCode();else if(act==="toggle-hyp")toggleHyp(parseInt(id,10));else if(act==="show-tab")showTab(el.getAttribute("data-tab"));else if(act==="open-help")openHelp();else if(act==="give-hint")giveHint(parseInt(el.getAttribute("data-level"),10));else if(act==="close-modal")closeModal();else if(act==="demo-end")showDemoEnd();else if(act==="open-board")openBoard();else if(act==="close-board")closeBoard();else if(act==="reset-demo")resetDemo();});
document.addEventListener("click",function(e){if(e.target&&e.target.id==="modalbg")closeModal();});
document.addEventListener("error",function(e){var im=e.target;if(!im||im.tagName!=="IMG"||!im.classList||!im.classList.contains("pimg"))return;var list=(im.getAttribute("data-srcs")||"").split("|");var i=parseInt(im.getAttribute("data-i")||"0",10)+1;if(i<list.length){im.setAttribute("data-i",String(i));im.src=list[i];}else{im.style.display="none";}},true);
function init(){var ib=document.getElementById("intro-build");if(ib)ib.textContent="build "+BUILD+" · "+BUILD_DATE;var resumed=load();var j=$("#journal");j.value=state.journal||"";j.addEventListener("input",function(){state.journal=j.value;save();});if(state.chapter>=2)$("#chaplabel").textContent="CHAPITRE 2 — AWA";renderHome();renderBoard();refreshEvButtons();if(state.introSeen){$("#intro").style.display="none";if(resumed)toast("▶ Partie reprise. Bonne enquête.");}else{renderSlide();}if(window.innerWidth>1020){$("#boardclose").style.display="none";}var t=new Date();$("#sbtime").textContent=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");}
try{init();}catch(err){console.error("Erreur d'initialisation :",err);}
</script>
</body>
</html>
